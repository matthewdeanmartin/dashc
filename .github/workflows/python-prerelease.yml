name: Python prerelease verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "dashc/**"
      - "tests/**"
      - ".github/workflows/python-prerelease.yml"

permissions:
  contents: read

env:
  PIP_ONLY_BINARY: ":all:"

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.14", "3.15"]
        dependencies: [locked]
        include:
          - os: ubuntu-latest
            python: "3.15"
            dependencies: prerelease
          - os: windows-latest
            python: "3.15"
            dependencies: prerelease
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
      - name: Install locked dependencies
        if: matrix.dependencies == 'locked'
        shell: bash
        run: |
          uv venv .venv --python "${{ matrix.python }}"
          uv export --locked --all-extras --no-emit-workspace --no-hashes --format requirements-txt --output-file .venv/verification-requirements.txt
          uv pip install --only-binary :all: --no-cache --prerelease disallow -r .venv/verification-requirements.txt
          uv pip install --only-binary :all: --no-cache --no-deps -e .
      - name: Install with dependency prereleases allowed
        if: matrix.dependencies == 'prerelease'
        shell: bash
        run: |
          uv venv .venv --python "${{ matrix.python }}"
          uv pip install --only-binary :all: --no-cache --upgrade --prerelease allow --group dev -e .
      - name: Verify interpreter and developer tool imports
        run: >-
          uv run --no-sync --python "${{ matrix.python }}" python -c
          "import sys; print(sys.version); import gha_update._core;
          import mkdocstrings; import mkdocs_autorefs;
          import httpx; assert hasattr(httpx, 'RequestError')"
      - name: Verify documentation CLI
        run: uv run --no-sync --python "${{ matrix.python }}" python -m mkdocs --version
      - name: Run tests
        run: >-
          uv run --no-sync --python "${{ matrix.python }}" pytest tests -q
          --timeout=30 --session-timeout=600 -p no:benchmark
