[project]
name = "dashc"
version = "0.1.1"
description = "Tool to generate python -c bash as if it were a package format."
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "Matthew Martin", email = "matthewdeanmartin@gmail.com" }]
keywords = ["bash", "packaging"]
dependencies = [
    "jinja2",
    "orjson",
    # CLI
    "argcomplete", # could be optional

]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[project.urls]
Repository = "https://github.com/matthewdeanmartin/dashc"
Changelog = "https://github.com/matthewdeanmartin/dashc/blob/main/CHANGELOG.md"

homepage = "https://github.com/matthewdeanmartin/dashc"
issues = "https://github.com/matthewdeanmartin/dashc/issues/"





[dependency-groups]
dev = [
    "jiggle-version>=2.1.0",
    "troml-dev-status>=0.6.0",
    "dont-be-lazy>=0.1.2",
    "pydoc-fork>=3.0.0",
    "keepachangelog-manager-fork[fast]>=6.8.0; python_version < '3.15'",
    "keepachangelog-manager-fork[stdlib]>=6.8.0; python_version >= '3.15'",

    "git2md",
    "pyclean; python_version >= '3.12'",
    "strip-docs>=1.0; python_version >= '3.12'",
    # gha-update and troml-dev-status require the HTTPX 0.x API.
    # https://github.com/davidism/gha-update/issues/39
    "gha-update; python_version >= '3.12'",
    "mkdocstrings[python]",
    "mkdocs<2; python_version >= '3.12'",
    "mdformat",
    # plugin finder
    "packaging",
    # mpy
    "mypy",
    "types-toml",
    # reports

    # build
    "vermin",
    "metametameta>=0.1.14",
    "hatchling",
    "ruff>=0.12.0",
    "pylint",
    "bandit",
    "pre-commit",
    # testing tools
    "pytest",
    "pytest-cov",
    "pytest-xdist>=3.5.0",
    "pytest-randomly>=3.15.0",
    "pytest-sugar>=0.9.7",
    "pytest-mock",
    "pytest-unused-fixtures",
    "hypothesis[cli]",
    "detect-test-pollution",
    "pytest-timeout>=2.4.0",
    # docs
    "interrogate>=1.5.0",
    "pydoctest==0.2.1",
    "pdoc3>=0.5.0",
    "mdformat>=0.5.0",
    "linkcheckmd>=1.4.0",
    "codespell>=2.2.6",
    "pyenchant>=3.2.2",
]

[tool.uv]
# Compatibility constraint for third-party tools; this project does not use HTTPX directly.
constraint-dependencies = ["httpx<1"]
default-groups = "all"

[tool.uv.sources]
dashc = { workspace = true }


[tool.uv.pip]
universal = true
[project.scripts]
dashc = "dashc.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel.sources]
"templates" = "dashc/templates"

[tool.hatch.build.targets.wheel]
packages = ["dashc"]
include = [
    "dashc/**/*.py",
    "dashc/py.typed",
    "/README.md", "LICENSE",
    "/tests"
]

[tool.hatch.build.targets.sdist]
include = ["/README.md", "LICENSE", "/dashc", "/tests"]


[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'
exclude = '''

(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
  | foo.py           # also separately exclude a file named foo.py in
                     # the root of the project
)
'''

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "test",
    "tests"
]
junit_family = "xunit1"
norecursedirs = ["vendor", "scripts"]
# don't know how to do this in toml
#addopts = "--strict-markers"
#markers =
#	slow: marks tests as slow (deselect with '-m "not slow"')
#	fast: marks tests as fast (deselect with '-m "not fast"')

[tool.isort]
default_section = "THIRDPARTY"
force_grid_wrap = 0
include_trailing_comma = true
known_first_party = ["dedlin"]
line_length = 120
multi_line_output = 3
use_parentheses = true

[tool.ruff]
line-length = 320

# Enable Pyflakes `E` and `F` codes by default.
lint.select = ["E", "F",
    "D", # docs
    "UP", # pyupgrade
    "B", # bugbear
]
lint.ignore = ["RUF100", 
    "D402",
    "D301", # messes with doctests
    "E722",
    # only track structural problems with docstrings, not whitespace, nor missing
    "D200", "D212", "D415", "D411", "D205", "D102", "D103", "D100", "D107", "D101", "D104", "D105",
    "UP007", "UP038", # Not sure if | is well supported in lowever versions of python
]
lint.per-file-ignores = { }

# Allow unused variables when underscore-prefixed.
lint.dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Exclude a variety of commonly ignored directories.
exclude = [
    "dead_code",
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Assume Python 3.10.
target-version = "py311"


[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.scriv]
version = "literal: pyproject.toml: tool.poetry.version"
format = "md"
main_branches = "master, main, develop, dev"

# changelogmanager (keepachangelog-manager-fork) drives the release workflows.
# See .github/workflows/create_draft_release.yml and release.yml.
[tool.changelogmanager.versioning]
scheme = "semver"

[tool.changelogmanager.validation]
enforce_preamble = true
format = "auto"

[tool.changelogmanager.defaults]
skip_ci = true
error_format = "github"
commit_schema = "keepachangelog"
schema_version = "current"

[[tool.changelogmanager.components]]
name = "default"
changelog = "CHANGELOG.md"


[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_also = [
    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self\\.debug",
    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",
    "except ImportError",
    "except ModuleNotFoundError",
    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",
    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod",
]

[tool.cli-tools]
python = { name = "python", version = ">=3.11.1", schema = "semver", tags = ["build"] }
